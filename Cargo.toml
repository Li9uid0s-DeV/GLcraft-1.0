[package]
name = "voxelcraft_26_3_wasm"
version = "0.26.3"
edition = "2021"
authors = ["VoxelCraft 26.3 Engine Team"]
description = "16-bit Palette-Compressed Chunk Engine, 7 World Generators, Data-Driven Mod Registry & Time-Sliced Explosion Engine for 4GB RAM Web Browsers"

[lib]
crate-type = ["cdylib", "rlib"]
path = "rust_engine/src/lib.rs"

[dependencies]
wasm-bindgen = "0.2.95"
js-sys = "0.3.72"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
