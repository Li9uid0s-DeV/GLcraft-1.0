      (function () {
        var hasRawTsx = !!document.querySelector('script[src*="/src/main.tsx"]');
        var isStaticPages =

        if (hasRawTsx && isStaticPages) {
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './public/gh-pages-bundle.css';
          document.head.appendChild(css);
          var js = document.createElement('script');
          js.type = 'module';
          js.src = './public/gh-pages-bundle.js';
          document.body.appendChild(js);
        }
